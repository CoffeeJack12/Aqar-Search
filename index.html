<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المستشار العقاري الذكي</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f7f6;font-family:Arial,sans-serif;color:#172220}
.app{max-width:900px;margin:auto;padding:25px 15px 130px}
h1{color:#087f72;margin-bottom:5px}
.sub{color:#667;margin-bottom:20px}
.chat,.panel{background:#fff;border-radius:20px;padding:18px;margin-bottom:15px;box-shadow:0 7px 25px #0000000d}
.chat{min-height:390px}
.msg{display:flex;margin:12px 0}
.user{justify-content:flex-start}
.bubble{max-width:82%;padding:13px 16px;border-radius:16px;line-height:1.7;white-space:pre-line}
.agent .bubble{background:#edf6f4}
.user .bubble{background:#168c7d;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
.card{background:#f3f8f7;border-radius:11px;padding:11px}
.card b{display:block;color:#168c7d;font-size:12px;margin-bottom:5px}
.inputbar{position:fixed;bottom:0;left:0;right:0;background:#f3f7f6f5;border-top:1px solid #ddd;padding:11px}
.wrap{max-width:900px;margin:auto;display:flex;gap:8px}
input{flex:1;padding:15px;border:1px solid #ccd8d5;border-radius:14px;font-size:16px}
button{border:0;background:#168c7d;color:#fff;padding:12px 18px;border-radius:13px;cursor:pointer}
.secondary{background:white;color:#168c7d;border:1px solid #168c7d;margin-top:12px}
.search{width:100%;margin-top:12px;display:none}
.confidence{font-size:12px;color:#667;margin-top:12px}
</style>
</head>

<body>
<div class="app">

<h1>المستشار العقاري الذكي</h1>
<div class="sub">تكلم بطريقتك. ما يحتاج ترتب طلبك.</div>

<div id="chat" class="chat"></div>

<div class="panel">
<h3>فهمت من العميل</h3>

<div class="grid">
<div class="card"><b>العملية</b><span id="purpose">—</span></div>
<div class="card"><b>العقار</b><span id="type">—</span></div>
<div class="card"><b>المدينة</b><span id="city">—</span></div>
<div class="card"><b>الموقع</b><span id="location">—</span></div>
<div class="card"><b>الغرف</b><span id="rooms">—</span></div>
<div class="card"><b>الميزانية</b><span id="budget">—</span></div>
<div class="card"><b>المساحة</b><span id="area">—</span></div>
<div class="card"><b>المميزات</b><span id="features">—</span></div>
</div>

<div id="confidence" class="confidence"></div>

<button id="search" class="search" onclick="readySearch()">
ابدأ البحث العقاري
</button>

<button class="secondary" onclick="resetConversation()">
بحث جديد
</button>
</div>
</div>

<div class="inputbar">
<div class="wrap">
<input id="input" placeholder="مثال: أبي روف في النهضة حول ٨٠٠...">
<button onclick="send()">إرسال</button>
</div>
</div>

<script>

/* ================================
   STORAGE / LEARNING
================================ */

const LEARN_KEY="realEstateAgentLearningV1";

let learned=JSON.parse(localStorage.getItem(LEARN_KEY)||"{}");

function saveLearning(){
 localStorage.setItem(LEARN_KEY,JSON.stringify(learned));
}

function learn(alias,value){
 alias=norm(alias);
 value=norm(value);

 if(!alias || !value || alias===value) return;

 learned[alias]=value;
 saveLearning();
}

function applyLearning(text){
 const keys=Object.keys(learned).sort((a,b)=>b.length-a.length);

 keys.forEach(k=>{
   if(text.includes(k)){
     text=text.split(k).join(learned[k]);
   }
 });

 return text;
}


/* ================================
   MEMORY
================================ */

function blank(){
 return{
  purpose:null,
  type:null,
  city:null,
  locations:[],
  excluded:[],
  rooms:null,
  roomsMode:null,
  budgetMin:null,
  budgetMax:null,
  budgetApprox:null,
  areaMin:null,
  areaMax:null,
  features:[],
  notes:[],
  awaiting:null,
  confidence:0
 };
}

let M=blank();


/* ================================
   NORMALIZATION
================================ */

function norm(t){

 const numbers={
  "٠":"0","١":"1","٢":"2","٣":"3","٤":"4",
  "٥":"5","٦":"6","٧":"7","٨":"8","٩":"9",
  "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4",
  "۵":"5","۶":"6","۷":"7","۸":"8","۹":"9"
 };

 t=String(t).toLowerCase();

 t=t.replace(/[٠-٩۰-۹]/g,x=>numbers[x]||x);

 return t
 .replace(/[إأآ]/g,"ا")
 .replace(/ة/g,"ه")
 .replace(/ى/g,"ي")
 .replace(/[ًٌٍَُِّْـ]/g,"")
 .replace(/[,،]/g," ")
 .replace(/\s+/g," ")
 .trim();
}

function any(t,list){
 return list.some(x=>t.includes(norm(x)));
}

function unique(arr,v){
 if(v&&!arr.includes(v))arr.push(v);
}


/* ================================
   DICTIONARIES
================================ */

const TYPES=[
 [["شقه","شقق","apartment","flat"],"شقة"],
 [["فيلا","فله","فلل","villa"],"فيلا"],
 [["دوبلكس","دبلكس","دوبليكس","duplex"],"دوبلكس"],
 [["تاون هاوس","تاونهاوس","townhouse"],"تاون هاوس"],
 [["ارض","اراضي","land"],"أرض"],
 [["عماره","عمائر","building"],"عمارة"],
 [["دور","floor"],"دور"],
 [["استراحه","شاليه"],"استراحة"]
];

const CITIES=[
 [["جده","جدة","jeddah"],"جدة"],
 [["الرياض","riyadh"],"الرياض"],
 [["مكه","مكة","makkah"],"مكة"],
 [["المدينه","المدينة","madinah"],"المدينة المنورة"],
 [["الدمام","dammam"],"الدمام"],
 [["الخبر","khobar"],"الخبر"],
 [["الطايف","الطائف","taif"],"الطائف"],
 [["تبوك"],"تبوك"],
 [["ابها"],"أبها"]
];

const AREAS=[
 ["الشاطئ","الشاطئ"],["النهضه","النهضة"],
 ["الزهراء","الزهراء"],["السلامه","السلامة"],
 ["المحمديه","المحمدية"],["الروضه","الروضة"],
 ["النعيم","النعيم"],["الحمراء","الحمراء"],
 ["النزهه","النزهة"],["المرجان","المرجان"],
 ["البساتين","البساتين"],["الصفا","الصفا"],
 ["الفيحاء","الفيحاء"],["الربوه","الربوة"],
 ["السامر","السامر"],["الريان","الريان"],
 ["المنار","المنار"],["الواحه","الواحة"],
 ["الرحاب","الرحاب"],["البوادي","البوادي"],
 ["النسيم","النسيم"],["الاندلس","الأندلس"]
];


/* ================================
   MONEY
================================ */

function money(n,unit=""){

 n=parseFloat(n);

 unit=norm(unit);

 if(unit.includes("مليون")) return n*1000000;
 if(unit.includes("الف")||unit==="k") return n*1000;

 // العقار: 500 غالباً تعني 500 ألف في سياق الميزانية
 if(n>=100 && n<10000) return n*1000;

 return n;
}

function formatMoney(n){
 return new Intl.NumberFormat("en-US").format(Math.round(n))+" ريال";
}


/* ================================
   CORRECTION + LEARNING
================================ */

function detectTeaching(raw){

 const t=norm(raw);

 const patterns=[
  /(.+?)\s+(?:يعني|معناها|اقصد فيها|اقصد به)\s+(.+)/,
  /(?:لما اقول|اذا قلت)\s+(.+?)\s+(?:اقصد|يعني)\s+(.+)/,
  /(.+?)\s*=\s*(.+)/
 ];

 for(const p of patterns){

   const m=t.match(p);

   if(m){
     const alias=m[1].trim();
     const meaning=m[2].trim();

     if(alias.length<40 && meaning.length<60){
       learn(alias,meaning);

       return {
        learned:true,
        alias,
        meaning
       };
     }
   }
 }

 return {learned:false};
}


/* ================================
   UNDERSTANDING
================================ */

function understand(raw){

 let t=norm(raw);
 t=applyLearning(t);


 /* PURPOSE */

 if(any(t,[
  "شراء","للبيع","تمليك","تملك","اشتري",
  "ابي اشتري","ابغا اشتري","عايز اشتري",
  "buy","purchase"
 ])) M.purpose="شراء";

 if(any(t,[
  "ايجار","للايجار","استئجار","استاجر",
  "اجار","كراء","rent"
 ])) M.purpose="إيجار";


 /* TYPE */

 TYPES.forEach(([words,value])=>{
   if(any(t,words)) M.type=value;
 });


 /* ROOF */

 if(any(t,[
  "روف","رووف","سطح خاص","بنتهاوس",
  "بنت هاوس","penthouse"
 ])){
   unique(M.features,"روف");
   if(!M.type)M.type="شقة";
 }


 /* CITIES */

 CITIES.forEach(([words,value])=>{
   if(any(t,words))M.city=value;
 });


 /* AREAS */

 AREAS.forEach(([key,value])=>{

   if(t.includes(norm(key))){

     const k=norm(key);

     const negative=[
      "مو "+k,
      "مش "+k,
      "غير "+k,
      "ما ابي "+k,
      "ما ابغا "+k,
      "ما عايز "+k
     ];

     if(negative.some(x=>t.includes(x))){

       unique(M.excluded,value);
       M.locations=M.locations.filter(x=>x!==value);

     }else{
       unique(M.locations,value);
     }
   }
 });


 /* ROOMS */

 let rooms=t.match(
 /(\d+)\s*(?:غرف|غرفه|bedroom|bedrooms|bed|beds)/
 );

 if(rooms){

   M.rooms=parseInt(rooms[1]);

   if(any(t,[
    "على الاقل","اقل شي","اقل شيء",
    "ما يقل","او اكثر","واكثر","فوق"
   ])){
     M.roomsMode="min";
   }else{
     M.roomsMode="exact";
   }
 }


 /* BUDGET RANGE */

 let range=t.match(
 /(?:من\s*)?(\d+(?:\.\d+)?)\s*(الف|مليون|k)?\s*(?:الى|الي|-)\s*(\d+(?:\.\d+)?)\s*(الف|مليون|k)?/
 );

 if(range){

   const u1=range[2]||range[4]||"";
   const u2=range[4]||range[2]||"";

   M.budgetMin=money(range[1],u1);
   M.budgetMax=money(range[3],u2);
   M.budgetApprox=null;
 }


 /* MAX */

 let maximum=t.match(
 /(?:ما\s*(?:ابي|ابغا|عايز|بدي)?\s*(?:اتعدى|اتجاوز)|حدي|حد اقصى|اقصى ميزانيه|حتى|لحد)\s*(\d+(?:\.\d+)?)\s*(الف|مليون|k)?/
 );

 if(maximum){
   M.budgetMax=money(maximum[1],maximum[2]||"");
   M.budgetApprox=null;
 }


 /* APPROX */

 let approximate=t.match(
 /(?:حول|حوالي|تقريبا|بحدود|ميزانيتي|ميزانيه)\s*(\d+(?:\.\d+)?)\s*(الف|مليون|k)?/
 );

 if(approximate){
   M.budgetApprox=money(
     approximate[1],
     approximate[2]||""
   );
 }


 if(any(t,["نص مليون","نصف مليون"])){
   M.budgetApprox=500000;
 }


 /* AREA */

 let amin=t.match(
 /(?:مساحه\s*)?(?:فوق|اكثر من|على الاقل|اقل شي)\s*(\d+)\s*(?:متر|م2|م²)/
 );

 if(amin)M.areaMin=parseInt(amin[1]);

 let amax=t.match(
 /(?:مساحه\s*)?(?:تحت|اقل من|حد اقصى)\s*(\d+)\s*(?:متر|م2|م²)/
 );

 if(amax)M.areaMax=parseInt(amax[1]);


 /* FEATURES */

 const FEATURES=[
  [["مسبح","pool"],"مسبح"],
  [["حديقه","garden"],"حديقة"],
  [["بلكونه","شرفه","balcony"],"بلكونة"],
  [["مدخل خاص"],"مدخل خاص"],
  [["موقف خاص","باركنج","parking"],"موقف خاص"],
  [["مصعد","elevator"],"مصعد"],
  [["غرفه خادمه","خادمه"],"غرفة خادمة"],
  [["اطلاله بحر","بحر مباشر","sea view"],"إطلالة بحر"],
  [["قريب من البحر","جنب البحر"],"قريب من البحر"],
  [["دور عالي","دور مرتفع","مو دور واطي","مش دور واطي"],"دور مرتفع"],
  [["دور ارضي","ارضي"],"دور أرضي"],
  [["جديد","جديده"],"جديد"]
 ];

 FEATURES.forEach(([words,value])=>{
   if(any(t,words))unique(M.features,value);
 });


 /* FINANCE */

 if(any(t,["كاش","نقدي"]))unique(M.notes,"كاش");

 if(any(t,["تمويل","تمويل عقاري","بنك"]))
   unique(M.notes,"تمويل عقاري");

 if(any(t,["دعم سكني","مدعوم"]))
   unique(M.notes,"دعم سكني");


 calculateConfidence();
}


/* ================================
   CONFIDENCE
================================ */

function calculateConfidence(){

 let score=0;

 if(M.city)score+=20;
 if(M.purpose)score+=20;
 if(M.type)score+=20;

 if(M.rooms || ["أرض","عمارة"].includes(M.type))
   score+=15;

 if(M.budgetApprox||M.budgetMax||M.budgetMin)
   score+=15;

 if(M.locations.length||M.notes.includes("الموقع مرن"))
   score+=10;

 M.confidence=Math.min(score,100);
}


/* ================================
   QUESTIONS
================================ */

function nextQuestion(){

 if(!M.city){
   M.awaiting="city";
   return "تمام، في أي مدينة تبحث؟";
 }

 if(!M.purpose){
   M.awaiting="purpose";
   return "تبحث عن شراء وتمليك، أو إيجار؟";
 }

 if(!M.type){
   M.awaiting="type";
   return "وش نوع العقار اللي يناسبك؟ شقة، فيلا، دور، دوبلكس، أرض...؟";
 }

 if(!M.rooms&&!["أرض","عمارة"].includes(M.type)){
   M.awaiting="rooms";
   return "كم غرفة تحتاج؟ وإذا عندك حد أدنى قل لي مثلاً: 4 غرف فأكثر.";
 }

 if(!M.budgetApprox&&!M.budgetMax&&!M.budgetMin){
   M.awaiting="budget";
   return "كم حدود الميزانية؟ حتى لو تقريبية.";
 }

 if(!M.locations.length&&!M.notes.includes("الموقع مرن")){
   M.awaiting="location";
   return "في حي معين تفضله؟ تقدر تعطيني أكثر من حي، أو تقول «ما يفرق».";
 }

 M.awaiting=null;
 return null;
}


/* ================================
   SHORT FOLLOW-UP ANSWERS
================================ */

function followUp(raw){

 const t=applyLearning(norm(raw));

 if(M.awaiting==="rooms"){

   const n=t.match(/\d+/);

   if(n){
     M.rooms=parseInt(n[0]);
     M.roomsMode=
       any(t,["اقل شي","على الاقل","او اكثر","فوق"])
       ?"min":"exact";
   }
 }

 if(M.awaiting==="budget"){

   const n=t.match(/(\d+(?:\.\d+)?)\s*(الف|مليون|k)?/);

   if(n)M.budgetApprox=money(n[1],n[2]||"");
 }

 if(M.awaiting==="location" &&
    any(t,["ما يفرق","مايفرق","اي حي","اي مكان","مو مهم","مش مهم"])){

   unique(M.notes,"الموقع مرن");
 }

 calculateConfidence();
}


/* ================================
   RESPONSE
================================ */

function response(){

 const q=nextQuestion();

 if(q)return q;

 let r="ممتاز. كذا فهمت طلبك بشكل كافي للبحث.";

 if(M.excluded.length)
   r+="\nالمناطق المستبعدة: "+M.excluded.join("، ")+".";

 r+="\n\nإذا حاب تعدّل شيء، قل لي مباشرة. مثال: «لا، خليها 5 غرف» أو «ارفع الميزانية لمليون».";

 return r;
}


/* ================================
   UI
================================ */

function message(text,who){

 const chat=document.getElementById("chat");

 const row=document.createElement("div");
 row.className="msg "+who;

 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent=text;

 row.appendChild(bubble);
 chat.appendChild(row);

 chat.scrollTop=chat.scrollHeight;
}


function send(){

 const input=document.getElementById("input");
 const raw=input.value.trim();

 if(!raw)return;

 message(raw,"user");
 input.value="";


 /* Does user teach the agent? */

 const teaching=detectTeaching(raw);

 if(teaching.learned){

   message(
    `تمام، تعلمت أن «${teaching.alias}» تقصد بها «${teaching.meaning}».`,
    "agent"
   );

   update();
   return;
 }


 /* Normal conversation */

 followUp(raw);
 understand(raw);
 update();

 setTimeout(()=>{
   message(response(),"agent");
   update();
 },180);
}


/* ================================
   SUMMARY
================================ */

function update(){

 calculateConfidence();

 document.getElementById("purpose").textContent=M.purpose||"—";
 document.getElementById("type").textContent=M.type||"—";
 document.getElementById("city").textContent=M.city||"—";

 document.getElementById("location").textContent=
   M.locations.length?M.locations.join("، "):
   M.notes.includes("الموقع مرن")?"مرن":"—";

 document.getElementById("rooms").textContent=
   M.rooms
   ? M.rooms+(M.roomsMode==="min"?" فأكثر":"")
   :"—";


 let b="—";

 if(M.budgetMin&&M.budgetMax)
   b=formatMoney(M.budgetMin)+" - "+formatMoney(M.budgetMax);

 else if(M.budgetMax)
   b="حتى "+formatMoney(M.budgetMax);

 else if(M.budgetApprox)
   b="حوالي "+formatMoney(M.budgetApprox);

 document.getElementById("budget").textContent=b;


 let a="—";

 if(M.areaMin)a=M.areaMin+" م² فأكثر";
 if(M.areaMax)a="حتى "+M.areaMax+" م²";

 document.getElementById("area").textContent=a;


 document.getElementById("features").textContent=
   [...M.features,...M.notes].join("، ")||"—";


 document.getElementById("confidence").textContent=
   "درجة اكتمال طلب العميل: "+M.confidence+"%";


 document.getElementById("search").style.display=
   nextQuestion() ? "none":"block";
}


/* ================================
   SEARCH READY
================================ */

function readySearch(){

 let text="طلب البحث جاهز:\n\n";

 text+="• "+M.purpose+" "+M.type+"\n";
 text+="• "+M.city+"\n";

 if(M.locations.length)
   text+="• "+M.locations.join(" أو ")+"\n";

 if(M.rooms)
   text+="• "+M.rooms+
   (M.roomsMode==="min"?" غرف فأكثر":" غرف")+"\n";

 if(M.budgetMax)
   text+="• حتى "+formatMoney(M.budgetMax)+"\n";

 else if(M.budgetApprox)
   text+="• حوالي "+formatMoney(M.budgetApprox)+"\n";

 if(M.features.length)
   text+="• "+M.features.join("، ")+"\n";

 message(text,"agent");

 message(
   "المواصفات أصبحت جاهزة. المرحلة التالية هي توصيل هذا الطلب بمحرك نتائج العقارات.",
   "agent"
 );
}


/* ================================
   RESET
================================ */

function resetConversation(){

 M=blank();

 document.getElementById("chat").innerHTML="";

 message(
  "هلا! أنا مستشارك العقاري.\nقل لي بطريقتك وش العقار اللي تدور عليه، وأنا أسألك عن الأشياء الناقصة.",
  "agent"
 );

 update();
}


/* ENTER */

document.getElementById("input").addEventListener("keydown",e=>{
 if(e.key==="Enter")send();
});


resetConversation();

</script>
</body>
</html>
