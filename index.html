<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>باحث عقار | المستشار العقاري</title>

<style>
:root{
  --green:#176b5b;
  --green2:#0f584b;
  --light:#eef7f4;
  --bg:#f4f7f6;
  --text:#17211f;
  --muted:#73807d;
  --border:#dce7e3;
  --white:#fff;
  --danger:#a83e3e;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
}

.app{
  width:min(100%,1000px);
  margin:auto;
  padding:22px 14px 120px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}

.brand h1{
  margin:0;
  color:var(--green);
  font-size:27px;
}

.brand p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:14px;
}

.badge{
  background:#e4f3ee;
  color:var(--green);
  padding:8px 12px;
  border-radius:999px;
  font-size:12px;
  white-space:nowrap;
}

.chat{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:22px;
  min-height:430px;
  max-height:58vh;
  overflow-y:auto;
  padding:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.04);
}

.row{
  display:flex;
  margin:11px 0;
}

.row.agent{justify-content:flex-end}
.row.user{justify-content:flex-start}

.bubble{
  max-width:82%;
  padding:12px 15px;
  border-radius:17px;
  line-height:1.75;
  white-space:pre-line;
  word-break:break-word;
}

.agent .bubble{
  background:var(--light);
  border-bottom-right-radius:5px;
}

.user .bubble{
  background:var(--green);
  color:#fff;
  border-bottom-left-radius:5px;
}

.summary{
  margin-top:14px;
  background:#fff;
  border:1px solid var(--border);
  border-radius:20px;
  padding:16px;
}

.summaryTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.summaryTop h3{
  margin:0;
  font-size:17px;
}

.completeness{
  color:var(--green);
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.card{
  background:#f6f9f8;
  border-radius:12px;
  padding:11px;
  min-height:64px;
}

.card b{
  display:block;
  color:var(--green);
  font-size:11px;
  margin-bottom:6px;
}

.card span{
  font-size:13px;
  line-height:1.5;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

button{
  border:0;
  border-radius:12px;
  padding:12px 16px;
  font-size:14px;
  cursor:pointer;
  font-family:inherit;
}

.primary{
  background:var(--green);
  color:white;
}

.primary:hover{background:var(--green2)}

.secondary{
  background:white;
  color:var(--green);
  border:1px solid var(--green);
}

.searchBtn{
  flex:1;
  display:none;
}

.dev{
  margin-top:12px;
  display:none;
  padding:12px;
  border-radius:12px;
  background:#151918;
  color:#d7efe7;
  direction:ltr;
  text-align:left;
  white-space:pre-wrap;
  font-family:monospace;
  font-size:11px;
  overflow:auto;
}

.inputBar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:rgba(244,247,246,.96);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
}

.inputWrap{
  max-width:1000px;
  margin:auto;
  display:flex;
  gap:8px;
}

#input{
  flex:1;
  min-width:0;
  border:1px solid #cbd9d5;
  background:#fff;
  border-radius:14px;
  padding:14px 15px;
  font-size:16px;
  outline:none;
  font-family:inherit;
}

#input:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(23,107,91,.08);
}

.send{
  min-width:76px;
  background:var(--green);
  color:#fff;
}

@media(max-width:700px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .bubble{max-width:90%}
  .brand h1{font-size:23px}
  .badge{display:none}
}

@media(max-width:380px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="brand">
      <h1>المستشار العقاري</h1>
      <p>قل لي وش تدور عليه بطريقتك.</p>
    </div>
    <div class="badge">ذاكرة + تعلّم</div>
  </div>

  <div id="chat" class="chat"></div>

  <div class="summary">

    <div class="summaryTop">
      <h3>متطلبات العميل</h3>
      <div id="completion" class="completeness">0% مكتمل</div>
    </div>

    <div class="grid">
      <div class="card"><b>العملية</b><span id="vPurpose">—</span></div>
      <div class="card"><b>نوع العقار</b><span id="vType">—</span></div>
      <div class="card"><b>المدينة</b><span id="vCity">—</span></div>
      <div class="card"><b>الأحياء</b><span id="vDistricts">—</span></div>

      <div class="card"><b>الغرف</b><span id="vRooms">—</span></div>
      <div class="card"><b>الميزانية</b><span id="vBudget">—</span></div>
      <div class="card"><b>المساحة</b><span id="vArea">—</span></div>
      <div class="card"><b>شروط إضافية</b><span id="vFeatures">—</span></div>
    </div>

    <div class="actions">
      <button id="searchBtn" class="primary searchBtn" onclick="prepareSearch()">
        ابدأ البحث
      </button>

      <button class="secondary" onclick="newSearch()">
        بحث جديد
      </button>

      <button class="secondary" onclick="toggleDev()">
        تشخيص
      </button>
    </div>

    <div id="dev" class="dev"></div>
  </div>
</div>

<div class="inputBar">
  <div class="inputWrap">
    <input
      id="input"
      autocomplete="off"
      placeholder="اكتب طلبك... مثال: أبغا شقة ٣ غرف في النعيم في جدة"
    >
    <button class="send" onclick="sendMessage()">إرسال</button>
  </div>
</div>

<script>

/* =====================================================
   REAL ESTATE CONVERSATIONAL MINI AGENT
   No external AI / No API
===================================================== */

const LEARNING_KEY = "aqar_agent_learning_v3";
const SESSION_KEY  = "aqar_agent_session_v3";

let learned = safeJSON(localStorage.getItem(LEARNING_KEY), {aliases:{}});

function emptyState(){
  return {
    purpose:null,
    type:null,
    city:null,

    districts:[],
    excludedDistricts:[],

    rooms:null,
    roomsMode:null,

    bathrooms:null,

    budgetMin:null,
    budgetMax:null,
    budgetApprox:null,
    budgetFlexible:false,

    areaMin:null,
    areaMax:null,

    features:[],
    notes:[],

    locationFlexible:false,
    roomsFlexible:false,

    awaiting:null,

    lastUserMessage:"",
    lastIntent:"",
    confidence:0
  };
}

let state = safeJSON(localStorage.getItem(SESSION_KEY), emptyState());

/* ===================== UTILITIES ===================== */

function safeJSON(value,fallback){
  try{
    const parsed=JSON.parse(value);
    return parsed || fallback;
  }catch(e){
    return fallback;
  }
}

function save(){
  localStorage.setItem(SESSION_KEY,JSON.stringify(state));
  localStorage.setItem(LEARNING_KEY,JSON.stringify(learned));
}

function uniquePush(arr,value){
  if(value && !arr.includes(value)) arr.push(value);
}

function removeValue(arr,value){
  return arr.filter(x=>x!==value);
}

function normalizeArabic(text){

  const digits={
    "٠":"0","١":"1","٢":"2","٣":"3","٤":"4",
    "٥":"5","٦":"6","٧":"7","٨":"8","٩":"9",
    "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4",
    "۵":"5","۶":"6","۷":"7","۸":"8","۹":"9"
  };

  return String(text||"")
    .toLowerCase()
    .replace(/[٠-٩۰-۹]/g,c=>digits[c]||c)
    .replace(/[إأآ]/g,"ا")
    .replace(/ى/g,"ي")
    .replace(/ة/g,"ه")
    .replace(/[ًٌٍَُِّْـ]/g,"")
    .replace(/[،,؛;]/g," ")
    .replace(/\s+/g," ")
    .trim();
}

function has(text,phrases){
  return phrases.some(p=>text.includes(normalizeArabic(p)));
}

function escapeRegExp(str){
  return str.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
}

function applyLearning(text){

  let result=text;

  const aliases=Object.keys(learned.aliases||{})
    .sort((a,b)=>b.length-a.length);

  aliases.forEach(alias=>{
    const target=learned.aliases[alias];
    result=result.replace(
      new RegExp(escapeRegExp(alias),"g"),
      target
    );
  });

  return result;
}

/* ===================== NUMBER WORDS ===================== */

const NUMBER_WORDS = [
  ["عشره",10],
  ["تسعه",9],["تسع",9],
  ["ثمانيه",8],["ثمان",8],
  ["سبعه",7],["سبع",7],
  ["سته",6],["ست",6],
  ["خمسه",5],["خمس",5],
  ["اربعه",4],["اربع",4],
  ["ثلاثه",3],["ثلاث",3],
  ["اثنين",2],["اثنتين",2],["اتنين",2],["ثنتين",2],["ثنين",2],
  ["واحده",1],["واحد",1]
];

function wordNumber(text){

  for(const [word,num] of NUMBER_WORDS){
    if(text.includes(word)) return num;
  }

  return null;
}

/* ===================== KNOWLEDGE ===================== */

const PROPERTY_TYPES=[
  {
    value:"دوبلكس",
    words:["دوبلكس","دبلكس","دوبليكس","دوبليكس","duplex"]
  },
  {
    value:"تاون هاوس",
    words:["تاون هاوس","تاونهاوس","town house","townhouse"]
  },
  {
    value:"بنتهاوس",
    words:["بنتهاوس","بنت هاوس","penthouse"]
  },
  {
    value:"استراحة",
    words:["استراحه","شاليه","chalet"]
  },
  {
    value:"عمارة",
    words:["عماره","عمائر","building"]
  },
  {
    value:"أرض",
    words:["ارض","اراضي","قطعه ارض","land"]
  },
  {
    value:"فيلا",
    words:["فيلا","فله","فلل","villa"]
  },
  {
    value:"شقة",
    words:["شقه","شقق","apartment","flat"]
  }
];

const CITIES=[
  {value:"جدة",words:["جده","جدة","jeddah"]},
  {value:"الرياض",words:["الرياض","رياض","riyadh"]},
  {value:"مكة",words:["مكه","مكة","makkah","mecca"]},
  {value:"المدينة المنورة",words:["المدينه المنوره","المدينه","madinah","medina"]},
  {value:"الخبر",words:["الخبر","khobar"]},
  {value:"الدمام",words:["الدمام","dammam"]},
  {value:"الطائف",words:["الطايف","الطائف","taif"]},
  {value:"تبوك",words:["تبوك","tabuk"]},
  {value:"أبها",words:["ابها","abha"]},
  {value:"خميس مشيط",words:["خميس مشيط"]},
  {value:"ينبع",words:["ينبع"]},
  {value:"الجبيل",words:["الجبيل"]},
  {value:"القصيم",words:["القصيم"]},
  {value:"بريدة",words:["بريده","بريدة"]}
];

const DISTRICTS=[
  ["الشاطئ","الشاطئ"],
  ["النعيم","النعيم"],
  ["النهضه","النهضة"],
  ["الزهراء","الزهراء"],
  ["السلامه","السلامة"],
  ["المحمديه","المحمدية"],
  ["الروضه","الروضة"],
  ["الحمراء","الحمراء"],
  ["النزهه","النزهة"],
  ["المرجان","المرجان"],
  ["البساتين","البساتين"],
  ["الصفا","الصفا"],
  ["الفيحاء","الفيحاء"],
  ["الربوه","الربوة"],
  ["السامر","السامر"],
  ["الريان","الريان"],
  ["المنار","المنار"],
  ["الواحه","الواحة"],
  ["الرحاب","الرحاب"],
  ["البوادي","البوادي"],
  ["النسيم","النسيم"],
  ["الاندلس","الأندلس"],
  ["مشرفه","مشرفة"],
  ["الرويس","الرويس"],
  ["الورود","الورود"],
  ["الاجواد","الأجواد"],
  ["الصفوه","الصفوة"],
  ["ابحر الشماليه","أبحر الشمالية"],
  ["ابحر الجنوبيه","أبحر الجنوبية"],
  ["ابحر","أبحر"],
  ["البغداديه","البغدادية"],
  ["الجامعه","الجامعة"],
  ["البلد","البلد"],
  ["السنابل","السنابل"],
  ["الامير فواز","الأمير فواز"]
];

/* ===================== LEARNING ===================== */

function detectTeaching(raw){

  const text=normalizeArabic(raw);

  const patterns=[
    /^(.{1,35}?)\s+(?:يعني|معناها|معناه)\s+(.{1,50})$/,
    /^(?:لما اقول|اذا قلت)\s+(.{1,35}?)\s+(?:اقصد|يعني)\s+(.{1,50})$/,
    /^(.{1,35}?)\s*=\s*(.{1,50})$/
  ];

  for(const regex of patterns){

    const match=text.match(regex);

    if(match){

      const alias=match[1].trim();
      const meaning=match[2].trim();

      if(alias && meaning && alias!==meaning){

        learned.aliases=learned.aliases||{};
        learned.aliases[alias]=meaning;

        save();

        return {alias,meaning};
      }
    }
  }

  return null;
}

/* ===================== CONTEXTUAL FOLLOW UPS ===================== */

function parseAwaiting(raw){

  let text=applyLearning(normalizeArabic(raw));

  if(!state.awaiting) return;

  if(state.awaiting==="purpose"){

    if(has(text,[
      "تمليك","شراء","اشتري","للبيع","ملك","تملك","buy"
    ])){
      state.purpose="شراء";
    }

    if(has(text,[
      "ايجار","اجار","استئجار","للايجار","rent"
    ])){
      state.purpose="إيجار";
    }
  }

  if(state.awaiting==="city"){

    for(const city of CITIES){
      if(has(text,city.words)){
        state.city=city.value;
        break;
      }
    }
  }

  if(state.awaiting==="type"){

    for(const item of PROPERTY_TYPES){
      if(has(text,item.words)){
        state.type=item.value;
        break;
      }
    }

    if(has(text,["روف","سطح خاص"])){
      state.type="شقة";
      uniquePush(state.features,"روف");
    }

    if(
      has(text,["دور"]) &&
      !has(text,["دور عالي","دور مرتفع","دور ارضي","دور واطي"])
    ){
      state.type="دور";
    }
  }

  if(state.awaiting==="rooms"){

    if(has(text,["ما يفرق","مايفرق","اي عدد","مو مهم","مش مهم"])){
      state.roomsFlexible=true;
    }else{

      const digit=text.match(/\d+/);
      const n=digit ? Number(digit[0]) : wordNumber(text);

      if(n && n<=20){
        state.rooms=n;

        state.roomsMode=
          has(text,["على الاقل","اقل شي","او اكثر","فاكثر","فوق"])
          ? "min"
          : "exact";
      }
    }
  }

  if(state.awaiting==="budget"){

    if(has(text,[
      "ما يفرق","مايفرق","مفتوحه","مفتوح","بدون حد",
      "مو مهم","مش مهم"
    ])){
      state.budgetFlexible=true;
    }else{
      parseBudget(text,true);
    }
  }

  if(state.awaiting==="district"){

    if(has(text,[
      "ما يفرق","مايفرق","اي حي","اي منطقه",
      "اي مكان","مو مهم","مش مهم"
    ])){
      state.locationFlexible=true;
    }
  }
}

/* ===================== BUDGET ===================== */

function toMoney(number,unit){

  let n=Number(number);
  const u=normalizeArabic(unit||"");

  if(u.includes("مليون")) return n*1000000;
  if(u.includes("الف") || u==="k") return n*1000;

  if(n>=100 && n<10000) return n*1000;

  return n;
}

function parseBudget(text,contextual=false){

  if(has(text,["مليون ونص","مليون و نص","مليون ونصف"])){
    state.budgetApprox=1500000;
    state.budgetMin=null;
    state.budgetMax=null;
    state.budgetFlexible=false;
    return true;
  }

  if(has(text,["نص مليون","نصف مليون"])){
    state.budgetApprox=500000;
    state.budgetMin=null;
    state.budgetMax=null;
    state.budgetFlexible=false;
    return true;
  }

  let millionPlus=text.match(
    /مليون\s*(?:و)?\s*(\d{2,3})\s*(?:الف)?/
  );

  if(millionPlus){
    state.budgetApprox=
      1000000+(Number(millionPlus[1])*1000);

    state.budgetMin=null;
    state.budgetMax=null;
    state.budgetFlexible=false;
    return true;
  }

  let range=text.match(
    /(?:من\s*)?(\d+(?:\.\d+)?)\s*(الف|مليون|k)?\s*(?:الى|الي|-)\s*(\d+(?:\.\d+)?)\s*(الف|مليون|k)?/
  );

  if(range){

    const u1=range[2]||range[4]||"";
    const u2=range[4]||range[2]||"";

    state.budgetMin=toMoney(range[1],u1);
    state.budgetMax=toMoney(range[3],u2);
    state.budgetApprox=null;
    state.budgetFlexible=false;

    return true;
  }

  let maximum=text.match(
    /(?:ما\s*(?:ابي|ابغا|ابغى|عايز|بدي)?\s*(?:اتعدى|اتجاوز)|حدي|حد اقصى|اقصى ميزانيه|حتى|لحد|ما فوق)\s*(\d+(?:\.\d+)?)\s*(الف|مليون|k)?/
  );

  if(maximum){

    state.budgetMax=toMoney(maximum[1],maximum[2]);
    state.budgetApprox=null;
    state.budgetMin=null;
    state.budgetFlexible=false;

    return true;
  }

  let minimum=text.match(
    /(?:من|فوق|اكثر من)\s*(\d+(?:\.\d+)?)\s*(الف|مليون|k)\s*(?:ريال)?/
  );

  if(minimum && has(text,["ميزاني","سعر","ريال","مليون","الف"])){

    state.budgetMin=toMoney(minimum[1],minimum[2]);
    state.budgetApprox=null;
    state.budgetFlexible=false;

    return true;
  }

  let approximate=text.match(
    /(?:حول|حوالي|حدود|بحدود|تقريبا|تقريباً|ميزانيتي|ميزانيه|ميزانية|السعر)\s*(\d+(?:\.\d+)?)\s*(الف|مليون|k)?/
  );

  if(approximate){

    state.budgetApprox=
      toMoney(approximate[1],approximate[2]);

    state.budgetMin=null;
    state.budgetMax=null;
    state.budgetFlexible=false;

    return true;
  }

  let explicit=text.match(
    /(\d+(?:\.\d+)?)\s*(الف|مليون|k)\s*(?:ريال)?/
  );

  if(explicit && !has(text,["متر","م2","م²"])){

    state.budgetApprox=toMoney(explicit[1],explicit[2]);
    state.budgetFlexible=false;

    return true;
  }

  if(contextual){

    const plain=text.match(/^(\d+(?:\.\d+)?)$/);

    if(plain){

      state.budgetApprox=toMoney(plain[1],"");
      state.budgetMin=null;
      state.budgetMax=null;
      state.budgetFlexible=false;

      return true;
    }
  }

  return false;
}

/* ===================== GENERAL UNDERSTANDING ===================== */

function understand(raw){

  let text=applyLearning(normalizeArabic(raw));

  state.lastUserMessage=raw;

  /* transaction */

  if(has(text,[
    "تمليك","شراء","اشتري","ابغا اشتري","ابي اشتري",
    "عايز اشتري","للبيع","تملك","buy","purchase"
  ])){
    state.purpose="شراء";
  }

  if(has(text,[
    "ايجار","اجار","للايجار","استئجار","استاجر",
    "عايز اجر","rent"
  ])){
    state.purpose="إيجار";
  }

  /* property type */

  for(const item of PROPERTY_TYPES){
    if(has(text,item.words)){
      state.type=item.value;
      break;
    }
  }

  if(has(text,["روف","رووف","سطح خاص"])){

    uniquePush(state.features,"روف");

    if(!state.type || state.type==="شقة"){
      state.type="شقة";
    }
  }

  /*
    كلمة "دور" لا تعتبر نوع عقار إذا كانت جزءًا من
    "دور عالي / أرضي / واطي"
  */

  if(
    has(text,["دور"]) &&
    !has(text,[
      "دور عالي","دور مرتفع","دور واطي",
      "دور ارضي","الدور العالي","الدور الارضي"
    ]) &&
    !state.type
  ){
    state.type="دور";
  }

  /* city */

  for(const city of CITIES){
    if(has(text,city.words)){
      state.city=city.value;
      break;
    }
  }

  /* districts + exclusions */

  for(const [rawDistrict,display] of DISTRICTS){

    const district=normalizeArabic(rawDistrict);

    if(!text.includes(district)) continue;

    const negatives=[
      "مو "+district,
      "مش "+district,
      "غير "+district,
      "ما ابي "+district,
      "ما ابغا "+district,
      "ما ابغى "+district,
      "ما عايز "+district,
      "استبعد "+district,
      "بدون "+district
    ];

    const excluded=negatives.some(x=>text.includes(x));

    if(excluded){

      uniquePush(state.excludedDistricts,display);
      state.districts=removeValue(state.districts,display);

    }else{

      if(!state.excludedDistricts.includes(display)){
        uniquePush(state.districts,display);
      }
    }
  }

  /* bedrooms */

  let roomMatch=text.match(
    /(\d+)\s*(?:غرف|غرفه|غرف نوم|bed|beds|bedroom|bedrooms)/
  );

  if(roomMatch){

    state.rooms=Number(roomMatch[1]);
    state.roomsFlexible=false;

    state.roomsMode=
      has(text,[
        "على الاقل","اقل شي","اقل شيء",
        "او اكثر","فاكثر","واكثر","ما يقل"
      ])
      ? "min"
      : "exact";
  }else{

    for(const [word,num] of NUMBER_WORDS){

      const roomRegex=
        new RegExp(
          escapeRegExp(word)+"\\s+(?:غرف|غرفه)"
        );

      if(roomRegex.test(text)){

        state.rooms=num;
        state.roomsFlexible=false;

        state.roomsMode=
          has(text,["على الاقل","او اكثر","فاكثر"])
          ? "min"
          : "exact";

        break;
      }
    }
  }

  /* bathrooms */

  let bath=text.match(
    /(\d+)\s*(?:حمام|حمامات|دورات مياه|دوره مياه)/
  );

  if(bath){
    state.bathrooms=Number(bath[1]);
  }

  /* budget */

  parseBudget(text,false);

  /* area range */

  let areaRange=text.match(
    /(?:مساحه|المساحه)?\s*(?:من\s*)?(\d+)\s*(?:متر|م2|م²)?\s*(?:الى|الي|-)\s*(\d+)\s*(?:متر|م2|م²)/
  );

  if(areaRange){
    state.areaMin=Number(areaRange[1]);
    state.areaMax=Number(areaRange[2]);
  }

  let areaMin=text.match(
    /(?:مساحه|المساحه)?\s*(?:فوق|اكثر من|على الاقل|اقل شي)\s*(\d+)\s*(?:متر|م2|م²)/
  );

  if(areaMin){
    state.areaMin=Number(areaMin[1]);
  }

  let areaMax=text.match(
    /(?:مساحه|المساحه)?\s*(?:اقل من|تحت|حد اقصى)\s*(\d+)\s*(?:متر|م2|م²)/
  );

  if(areaMax){
    state.areaMax=Number(areaMax[1]);
  }

  let exactArea=text.match(
    /(?:مساحه|المساحه)\s*(?:حول|حوالي|تقريبا)?\s*(\d+)\s*(?:متر|م2|م²)/
  );

  if(exactArea && !state.areaMin && !state.areaMax){
    state.areaMin=Number(exactArea[1]);
  }

  /* features */

  const featureMap=[
    [["مسبح","pool"],"مسبح"],
    [["حديقه","garden"],"حديقة"],
    [["بلكونه","شرفه","balcony"],"بلكونة"],
    [["مدخل خاص"],"مدخل خاص"],
    [["موقف خاص","موقف سياره","باركنج","parking"],"موقف"],
    [["مصعد","elevator"],"مصعد"],
    [["غرفه خادمه","خادمه"],"غرفة خادمة"],
    [["غرفه سائق","سائق"],"غرفة سائق"],
    [["اطلاله بحر","اطلالة بحر","بحر مباشر","sea view"],"إطلالة بحر"],
    [["قريب من البحر","جنب البحر"],"قريب من البحر"],
    [["دور عالي","دور مرتفع","مو دور واطي","مش دور واطي"],"دور مرتفع"],
    [["دور ارضي","ارضي"],"دور أرضي"],
    [["تراس","terrace"],"تراس"],
    [["مؤثث","مفروش","furnished"],"مؤثث"],
    [["غير مؤثث","غير مفروش"],"غير مؤثث"],
    [["جديد","جديده","جديدة"],"جديد"]
  ];

  for(const [words,value] of featureMap){

    if(has(text,words)){

      if(
        value==="مؤثث" &&
        has(text,["غير مؤثث","غير مفروش"])
      ) continue;

      uniquePush(state.features,value);
    }
  }

  /* broader locations */

  if(has(text,["شمال جده","شمال جدة"])){
    uniquePush(state.features,"شمال جدة");
  }

  if(has(text,["جنوب جده","جنوب جدة"])){
    uniquePush(state.features,"جنوب جدة");
  }

  /* finance */

  if(has(text,["كاش","نقدي"])){
    uniquePush(state.notes,"كاش");
  }

  if(has(text,["تمويل","تمويل عقاري","عن طريق البنك"])){
    uniquePush(state.notes,"تمويل عقاري");
  }

  if(has(text,["دعم سكني","مدعوم","سكني"])){
    uniquePush(state.notes,"دعم سكني");
  }

  calculateConfidence();
}

/* ===================== CORRECTIONS ===================== */

function detectCorrections(raw){

  const text=applyLearning(normalizeArabic(raw));

  /*
    أحدث قيمة صريحة تعتبر تحديثًا.
    مثال: "لا خليها 4 غرف بدل 3"
  */

  if(has(text,[
    "خليها","خليه","بدل","قصدي",
    "غيرها","غيره","لا "
  ])){
    state.lastIntent="correction";
  }else{
    state.lastIntent="normal";
  }
}

/* ===================== CONFIDENCE ===================== */

function calculateConfidence(){

  let score=0;

  if(state.city) score+=20;
  if(state.purpose) score+=20;
  if(state.type) score+=20;

  if(
    state.rooms ||
    state.roomsFlexible ||
    ["أرض","عمارة"].includes(state.type)
  ) score+=15;

  if(
    state.budgetApprox ||
    state.budgetMin ||
    state.budgetMax ||
    state.budgetFlexible
  ) score+=15;

  if(
    state.districts.length ||
    state.locationFlexible ||
    state.features.includes("شمال جدة") ||
    state.features.includes("جنوب جدة")
  ) score+=10;

  state.confidence=Math.min(score,100);
}

/* ===================== NEXT QUESTION ===================== */

function nextQuestion(){

  if(!state.city){
    state.awaiting="city";
    return "تمام. في أي مدينة تدور؟";
  }

  if(!state.purpose){
    state.awaiting="purpose";
    return "تمام. تبغاه تمليك ولا إيجار؟";
  }

  if(!state.type){
    state.awaiting="type";
    return "وش نوع العقار اللي تدور عليه؟ شقة، فيلا، دور، دوبلكس، أرض...؟";
  }

  if(
    !state.rooms &&
    !state.roomsFlexible &&
    !["أرض","عمارة"].includes(state.type)
  ){
    state.awaiting="rooms";
    return "كم غرفة تحتاج؟";
  }

  if(
    !state.budgetApprox &&
    !state.budgetMin &&
    !state.budgetMax &&
    !state.budgetFlexible
  ){
    state.awaiting="budget";
    return "وكم حدود الميزانية تقريبًا؟";
  }

  if(
    !state.districts.length &&
    !state.locationFlexible &&
    !state.features.includes("شمال جدة") &&
    !state.features.includes("جنوب جدة")
  ){
    state.awaiting="district";
    return "في أحياء معينة تفضلها؟ وإذا ما يفرق معك قل لي «أي حي».";
  }

  state.awaiting=null;
  return null;
}

/* ===================== NATURAL RESPONSE ===================== */

function buildResponse(){

  const question=nextQuestion();

  if(question) return question;

  let response="تمام، كذا الصورة عندي واضحة.";

  if(state.excludedDistricts.length){
    response+="\nوبستبعد "+state.excludedDistricts.join("، ")+".";
  }

  response+="\n\nتقدر تضيف أو تغيّر أي شرط قبل البحث، أو اضغط «ابدأ البحث».";

  return response;
}

/* ===================== DISPLAY ===================== */

function formatMoney(n){

  if(!n) return "—";

  return new Intl.NumberFormat("en-US",{
    maximumFractionDigits:0
  }).format(n)+" ريال";
}

function budgetText(){

  if(state.budgetFlexible) return "مرنة";

  if(state.budgetMin && state.budgetMax){
    return formatMoney(state.budgetMin)+" – "+formatMoney(state.budgetMax);
  }

  if(state.budgetMax){
    return "حتى "+formatMoney(state.budgetMax);
  }

  if(state.budgetMin){
    return "من "+formatMoney(state.budgetMin);
  }

  if(state.budgetApprox){
    return "حوالي "+formatMoney(state.budgetApprox);
  }

  return "—";
}

function areaText(){

  if(state.areaMin && state.areaMax){
    return state.areaMin+" – "+state.areaMax+" م²";
  }

  if(state.areaMin){
    return state.areaMin+" م² فأكثر";
  }

  if(state.areaMax){
    return "حتى "+state.areaMax+" م²";
  }

  return "—";
}

function roomText(){

  if(state.roomsFlexible) return "مرن";

  if(!state.rooms) return "—";

  return state.rooms+
    (state.roomsMode==="min" ? " فأكثر" : "");
}

function locationText(){

  let parts=[];

  if(state.districts.length){
    parts.push(state.districts.join("، "));
  }

  if(state.locationFlexible){
    parts.push("أي حي");
  }

  if(state.excludedDistricts.length){
    parts.push("باستثناء "+state.excludedDistricts.join("، "));
  }

  return parts.join(" | ") || "—";
}

function updateUI(){

  calculateConfidence();

  document.getElementById("vPurpose").textContent=
    state.purpose||"—";

  document.getElementById("vType").textContent=
    state.type||"—";

  document.getElementById("vCity").textContent=
    state.city||"—";

  document.getElementById("vDistricts").textContent=
    locationText();

  document.getElementById("vRooms").textContent=
    roomText();

  document.getElementById("vBudget").textContent=
    budgetText();

  document.getElementById("vArea").textContent=
    areaText();

  const extras=[
    ...state.features,
    ...state.notes
  ];

  if(state.bathrooms){
    extras.push(state.bathrooms+" حمام");
  }

  document.getElementById("vFeatures").textContent=
    extras.length ? extras.join("، ") : "—";

  document.getElementById("completion").textContent=
    state.confidence+"% مكتمل";

  const ready=!nextQuestion();

  document.getElementById("searchBtn").style.display=
    ready ? "block" : "none";

  updateDev();

  save();
}

/* ===================== CHAT ===================== */

function addMessage(text,who){

  const chat=document.getElementById("chat");

  const row=document.createElement("div");
  row.className="row "+who;

  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=text;

  row.appendChild(bubble);
  chat.appendChild(row);

  chat.scrollTop=chat.scrollHeight;
}

function sendMessage(){

  const input=document.getElementById("input");
  const raw=input.value.trim();

  if(!raw) return;

  addMessage(raw,"user");
  input.value="";

  const teaching=detectTeaching(raw);

  if(teaching){

    addMessage(
      `تمام. تعلمت أن «${teaching.alias}» تعني «${teaching.meaning}».`,
      "agent"
    );

    updateUI();
    return;
  }

  detectCorrections(raw);

  /*
    أولاً نفهم الرد بناءً على السؤال السابق.
    بعدها نحلل الرسالة كاملة لاستخراج أي معلومات إضافية.
  */

  parseAwaiting(raw);
  understand(raw);

  const answer=buildResponse();

  updateUI();

  setTimeout(()=>{
    addMessage(answer,"agent");
    updateUI();
  },120);
}

/* ===================== SEARCH ===================== */

function prepareSearch(){

  let summary="تمام. هذا طلب البحث النهائي عندي:\n\n";

  summary+="العملية: "+(state.purpose||"غير محدد")+"\n";
  summary+="العقار: "+(state.type||"غير محدد")+"\n";
  summary+="المدينة: "+(state.city||"غير محدد")+"\n";
  summary+="الأحياء: "+locationText()+"\n";
  summary+="الغرف: "+roomText()+"\n";
  summary+="الميزانية: "+budgetText()+"\n";
  summary+="المساحة: "+areaText();

  if(state.features.length){
    summary+="\nالمميزات: "+state.features.join("، ");
  }

  if(state.notes.length){
    summary+="\nملاحظات: "+state.notes.join("، ");
  }

  addMessage(summary,"agent");

  addMessage(
    "الطلب جاهز للبحث. الخطوة التالية هي ربط هذه المواصفات بمصدر العقارات الفعلي، بدون فقدان أي شرط من المحادثة.",
    "agent"
  );
}

/* ===================== DEVELOPER MODE ===================== */

let devOpen=false;

function toggleDev(){

  devOpen=!devOpen;

  document.getElementById("dev").style.display=
    devOpen ? "block" : "none";

  updateDev();
}

function updateDev(){

  const box=document.getElementById("dev");

  if(!box) return;

  box.textContent=
    "AGENT STATE\n\n"+
    JSON.stringify(state,null,2)+
    "\n\nLEARNED ALIASES\n\n"+
    JSON.stringify(learned.aliases||{},null,2);
}

/* ===================== RESET ===================== */

function newSearch(){

  state=emptyState();

  localStorage.removeItem(SESSION_KEY);

  document.getElementById("chat").innerHTML="";

  addMessage(
    "هلا! أنا مستشارك العقاري.\n\nقل لي وش تدور عليه بطريقتك، حتى لو الطلب ناقص. بسألك عن الأشياء اللي أحتاجها وحدة وحدة.",
    "agent"
  );

  updateUI();

  document.getElementById("input").focus();
}

/* ===================== KEYBOARD ===================== */

document.getElementById("input")
.addEventListener("keydown",function(e){

  if(e.key==="Enter"){
    e.preventDefault();
    sendMessage();
  }
});

/* ===================== START ===================== */

if(
  !state ||
  typeof state!=="object" ||
  !Array.isArray(state.districts)
){
  state=emptyState();
}

addMessage(
  "هلا! أنا مستشارك العقاري.\n\nقل لي وش العقار اللي تدور عليه، وأنا بكمل معك الطلب خطوة بخطوة.",
  "agent"
);

updateUI();

</script>
